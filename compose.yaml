name: gamecenter
services:
  center:
    build: .
    image: gamecenter-runtime:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # URL fija: sustituir por "http://192.168.1.50:3000" si se desea.
      GAMECENTER_URL: "${GAMECENTER_URL:-${GAMECENTER_DETECTED_URL:-}}"
      GAME_IMAGE: gamecenter-runtime:local
      GAME_NETWORK: gamecenter-internal
      GAME_IDLE_MS: "86400000"
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - access
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  access:
  internal:
    name: gamecenter-internal
    internal: true
